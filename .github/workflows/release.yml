name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            command: build:win:local
          - os: macos-latest
            command: build:mac:local
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Sync version from tag
        run: node scripts/sync-version.js
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Install dependencies
        run: npm ci

      # 缓存自带运行时（uv/node），版本没变则跳过下载
      - name: Cache runtime binaries
        uses: actions/cache@v4
        with:
          path: resources/runtime
          key: runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/runtime-versions.json') }}

      - name: Fetch runtime binaries
        run: node scripts/fetch-runtime.mjs

      # 只构建，不发布（发布统一由下方 publish job 负责，避免多 job 各建一个 release）
      - name: Build
        run: npm run ${{ matrix.command }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.zip
            dist/*.dmg
            dist/latest*.yml
          retention-days: 30

  # 统一发布：等所有平台构建完，下载全部产物，创建/更新唯一的 Release
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -la dist/

      # 正式版（tag 不含 -beta）：创建正式 Release
      - name: Publish Release
        if: ${{ !contains(github.ref_name, '-beta') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true   # 创建草稿，人工编辑 release-notes 后手动发布
          make_latest: false   # 不自动设为 Latest（由人工确认后手动切换）
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/*.zip
            dist/*.dmg
            dist/latest*.yml
