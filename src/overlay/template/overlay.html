<div id="cuckoo-init-input-dialog" class="cuckoo-init-input-dialog cuckoo-hidden">
  <div class="cuckoo-init-input-box">
    <div class="cuckoo-init-input-header">
      <span id="cuckoo-init-input-title">请输入你要对 AI 说的内容</span>
      <button id="cuckoo-btn-init-close" class="cuckoo-btn-icon" title="关闭">×</button>
    </div>
    <textarea id="cuckoo-init-textarea" placeholder="在这里写下你的需求...（点发送后，将自动附加系统提示词）"></textarea>
    <div class="cuckoo-actions" style="margin-top: 8px; display: flex; justify-content: flex-end;">
      <button id="cuckoo-btn-init-send" class="cuckoo-btn cuckoo-btn-primary">发送</button>
    </div>
  </div>
</div>

<div id="cuckoo-first-time-dialog" class="cuckoo-first-time-dialog cuckoo-hidden">
  <div class="cuckoo-first-time-box">
    <button id="cuckoo-btn-first-close" class="cuckoo-btn-icon cuckoo-first-time-close" title="关闭">×</button>
    <div class="cuckoo-first-time-text">首次创建对话时，需要初始化项目，并选择一个项目目录，不然无法使用</div>
    <div class="cuckoo-actions">
      <button id="cuckoo-btn-first-init" class="cuckoo-btn cuckoo-btn-primary">初始化项目</button>
    </div>
  </div>
</div>
<div id="cuckoo-tool-mask" class="cuckoo-tool-mask cuckoo-hidden">
  <div class="cuckoo-tool-mask-box">
    <span class="cuckoo-tool-mask-spinner"></span>
    <div class="cuckoo-tool-mask-text">工具调用执行中，请不要有额外操作</div>
    <button id="cuckoo-tool-mask-cancel" class="cuckoo-tool-mask-cancel cuckoo-hidden">停止</button>
  </div>
</div>
