<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>网关聊天 - Cuckoo Code</title>
<style>
  /* ===== ChatGPT 风格设计 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #212121;            /* 主背景 */
    --bg-sidebar: #171717;    /* 侧栏/页头 */
    --bubble-user: #2f2f2f;   /* 用户气泡 */
    --line: #42424233;
    --text: #ececf1;
    --text-dim: #acacbc;
    --accent: #10a37f;        /* ChatGPT 绿 */
    --err: #ef8e8b;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ===== 顶栏 ===== */
  header {
    padding: 12px 20px; display: flex; align-items: center; gap: 10px;
    background: var(--bg); border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .brand-dot { width: 26px; height: 26px; border-radius: 50%; background: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; font-weight: 700; }
  header .title { font-size: 14px; font-weight: 600; }
  #gateway-model-label { color: var(--text-dim); font-size: 12px; }
  header .spacer { flex: 1; }
  header button {
    background: none; border: 1px solid var(--line); color: var(--text-dim);
    border-radius: 20px; padding: 6px 14px; cursor: pointer; font-size: 13px; transition: all .15s;
  }
  header button:hover { background: var(--bubble-user); color: var(--text); }

  /* ===== 消息区（ChatGPT：居中列 + 无气泡 assistant）===== */
  #messages { flex: 1; overflow-y: auto; padding: 24px 16px 40px; }
  #messages::-webkit-scrollbar { width: 8px; }
  #messages::-webkit-scrollbar-thumb { background: #42424266; border-radius: 4px; }
  .thread { max-width: 768px; margin: 0 auto; }

  .msg { margin-bottom: 28px; font-size: 15px; line-height: 1.75; animation: fadein .2s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg .meta { font-size: 12px; font-weight: 600; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .msg-inner { max-width: 85%; }
  .msg.user .meta { justify-content: flex-end; color: var(--text-dim); }
  .msg.user .content {
    background: var(--bubble-user); border-radius: 22px; padding: 12px 18px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant .meta { color: var(--text); }
  .msg.assistant .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent);
    display: inline-flex; align-items: center; justify-content: center; margin-right: 8px;
    font-size: 12px; color: #fff; vertical-align: middle; }
  .msg.assistant .content { color: var(--text); }
  .msg.error .content { color: var(--err); background: rgba(239,142,139,.08);
    border: 1px solid rgba(239,142,139,.25); border-radius: 12px; padding: 12px 16px;
    white-space: pre-wrap; word-break: break-word; }

  /* ===== Markdown（ChatGPT 排版）===== */
  .md p { margin: .6em 0; }
  .md h1, .md h2, .md h3 { margin: 1em 0 .45em; font-weight: 650; }
  .md h1 { font-size: 1.3em; } .md h2 { font-size: 1.18em; } .md h3 { font-size: 1.06em; }
  .md ul, .md ol { margin: .5em 0 .5em 1.5em; }
  .md li { margin: .2em 0; }
  .md code.inline { background: #2f2f2f; color: #e3e3e3; border-radius: 5px; padding: 2px 7px;
    font-family: 'Cascadia Code', Consolas, monospace; font-size: .9em; }
  .md a { color: #7ab7ff; text-decoration: underline; text-underline-offset: 3px; }
  .md blockquote { border-left: 3px solid #4d4d4d; margin: .6em 0; padding: .15em 0 .15em 14px; color: var(--text-dim); }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 1em 0; }
  .md strong { font-weight: 650; }

  .code-block { margin: .7em 0; border: 1px solid #42424266; border-radius: 12px; overflow: hidden; background: #1e1e1e; }
  .code-head { display: flex; justify-content: space-between; align-items: center;
    background: #2f2f2f; padding: 7px 16px; font-size: 12px; color: #acacbc; }
  .code-head .copy-btn { background: none; border: none; color: #acacbc; cursor: pointer; font-size: 12px;
    display: flex; align-items: center; gap: 5px; }
  .code-head .copy-btn:hover { color: #fff; }
  .code-block pre { margin: 0; padding: 14px 18px; overflow-x: auto; }
  .code-block code { font-family: 'Cascadia Code', Consolas, 'Courier New', monospace; font-size: 13.5px;
    color: #e3e3e3; white-space: pre; line-height: 1.55; }

  .cursor { display: inline-block; width: 9px; height: 17px; background: var(--accent);
    vertical-align: text-bottom; animation: blink 1s steps(1) infinite; border-radius: 2px; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ===== 空状态 ===== */
  #gateway-empty { text-align: center; color: var(--text-dim); padding-top: 10vh; }
  #gateway-empty .big { font-size: 40px; margin-bottom: 14px; }
  #gateway-empty h2 { color: var(--text); font-size: 22px; font-weight: 600; margin-bottom: 10px; }
  #gateway-empty .tip { font-size: 14px; line-height: 2.1; }
  #gateway-empty kbd { background: #2f2f2f; border: 1px solid #42424266; border-radius: 6px;
    padding: 2px 8px; font-size: 12.5px; color: var(--text); }

  /* ===== 底部输入（ChatGPT 药丸形）===== */
  .composer-wrap { flex-shrink: 0; padding: 0 16px 14px; }
  .composer { max-width: 768px; margin: 0 auto; background: var(--bubble-user);
    border: 1px solid var(--line); border-radius: 26px; padding: 12px 14px 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,.25); transition: border-color .15s; }
  .composer:focus-within { border-color: #565656; }
  #gateway-input {
    width: 100%; min-height: 28px; max-height: 200px; resize: none; border: none; background: none;
    color: var(--text); font-size: 15px; font-family: inherit; line-height: 1.55;
    display: block; overflow-y: auto;
  }
  #gateway-input:focus { outline: none; }
  #gateway-input::placeholder { color: #8e8ea0; }
  .send-row { display: flex; align-items: center; margin-top: 8px; }
  #gateway-status { color: var(--text-dim); font-size: 12px; margin-right: auto; }
  #gateway-send {
    width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--accent);
    color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: opacity .15s, transform .1s; flex-shrink: 0;
  }
  #gateway-send:hover { opacity: .85; }
  #gateway-send:disabled { opacity: .3; cursor: not-allowed; }
  #gateway-send svg { width: 18px; height: 18px; }
  .footnote { text-align: center; font-size: 11px; color: #8e8ea0; margin-top: 8px; }

  /* ===== 设置面板 ===== */
  #gateway-config {
    position: fixed; right: 16px; bottom: 120px; width: 410px; z-index: 9999;
    background: var(--bg-sidebar); border: 1px solid var(--line); border-radius: 16px; padding: 18px;
    box-shadow: 0 16px 48px rgba(0,0,0,.6); display: none;
  }
  #gateway-config.open { display: block; }
  #gateway-config .cfg-title { font-weight: 600; font-size: 15px; }
  #gateway-config label { display: block; font-size: 12.5px; color: var(--text-dim); margin: 12px 0 5px; }
  #gateway-config input {
    width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); padding: 9px 12px; font-size: 13.5px;
  }
  #gateway-config input:focus { outline: none; border-color: #565656; }
  #gateway-config .key-row { position: relative; }
  #gateway-config .key-eye { position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 12px; padding: 2px; }
  #gateway-config .row { display: flex; gap: 9px; margin-top: 16px; }
  #gateway-config button { flex: 1; border-radius: 10px; padding: 8px 0; cursor: pointer;
    border: 1px solid var(--line); background: var(--bubble-user); color: var(--text); font-size: 13.5px; }
  #gateway-config button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #gateway-config button.primary:hover { opacity: .9; }
  #gateway-config .hint { font-size: 11.5px; color: #8e8ea0; margin-top: 10px; line-height: 1.65; }
  #gateway-config .err-line { font-size: 12.5px; color: var(--err); margin-top: 8px; min-height: 15px; }
</style>
</head>
<body>
  <header>
    <span class="brand-dot">鸟</span>
    <span class="title">网关聊天</span>
    <span id="gateway-model-label">未配置</span>
    <span class="spacer"></span>
    <button id="gateway-config-toggle">⚙ 设置</button>
    <button id="gateway-new-chat">＋ 新会话</button>
  </header>

  <div id="messages">
    <div id="gateway-empty">
      <div class="big">🪺</div>
      <h2>有什么可以帮忙的？</h2>
      <div class="tip">
        连接任意 OpenAI 兼容网关，把 GPT 变成本地 Agent<br>
        先点右上角 <kbd>⚙ 设置</kbd> 填入 Base URL / API Key / 模型名<br>
        <kbd>Enter</kbd> 发送 · <kbd>Shift+Enter</kbd> 换行 · 工具结果会自动回传
      </div>
    </div>
  </div>

  <div class="composer-wrap">
    <div class="composer">
      <textarea id="gateway-input" rows="1" placeholder="给 Cuckoo 发消息…"></textarea>
      <div class="send-row">
        <span id="gateway-status"></span>
        <button id="gateway-send" title="发送"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
      </div>
    </div>
    <div class="footnote">Cuckoo 可能会犯错。请核查重要信息。</div>
  </div>

  <div id="gateway-config">
    <div class="cfg-title">网关设置</div>
    <label>网关地址（OpenAI 兼容 Base URL）</label>
    <input id="cfg-baseurl" placeholder="https://api.openai.com/v1" />
    <label>API Key（仅保存在本机主进程，页面永远拿不到明文）</label>
    <div class="key-row">
      <input id="cfg-apikey" type="password" placeholder="留空 = 不修改；输入新值覆盖" />
      <button class="key-eye" id="cfg-eye" type="button">显示</button>
    </div>
    <label>模型名</label>
    <input id="cfg-model" placeholder="gpt-4o-mini" />
    <label>温度 temperature（0-2）</label>
    <input id="cfg-temperature" placeholder="0.7" />
    <div class="err-line" id="cfg-err"></div>
    <div class="row">
      <button id="cfg-cancel">取消</button>
      <button id="cfg-save" class="primary">保存</button>
    </div>
    <div class="hint">支持任何 OpenAI 兼容网关（OpenAI / Azure / one-api / 自建推理服务）。<br>密钥仅存于本机 userData，只由主进程携带发起请求，页面拿不到明文。</div>
  </div>

<!-- 纯函数区：供页面契约单测直接执行（不含 DOM 依赖） -->
<script>
(function () {
  'use strict';
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // 极简 Markdown：先整体转义再做结构替换，杜绝 XSS
  function renderMD(src) {
    var text = String(src == null ? '' : src);
    var out = '', last = 0;
    var fence = /```([A-Za-z0-9_+#.-]*)\r?\n?([\s\S]*?)```/g, m;
    function inline(s) {
      return esc(s)
        .replace(/`([^`\n]+)`/g, '<code class="inline">$1</code>')
        .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    }
    function block(s) {
      var lines = s.split('\n'), html = '', inList = false;
      for (var i = 0; i < lines.length; i++) {
        var ln = lines[i];
        var h = ln.match(/^(#{1,3})\s+(.*)$/);
        var li = ln.match(/^\s*[-*•]\s+(.*)$/);
        var oli = ln.match(/^\s*\d+[.、]\s+(.*)$/);
        if (/^\s*(---+|\*\*\*+)\s*$/.test(ln)) { if (inList) { html += '</ul>'; inList = false; } html += '<hr>'; continue; }
        if (h) { if (inList) { html += '</ul>'; inList = false; } html += '<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'; continue; }
        if (li) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + inline(li[1]) + '</li>'; continue; }
        if (oli) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + inline(oli[1]) + '</li>'; continue; }
        if (inList) { html += '</ul>'; inList = false; }
        if (ln.trim() === '') continue;
        html += '<p>' + inline(ln) + '</p>';
      }
      if (inList) html += '</ul>';
      return html;
    }
    while ((m = fence.exec(text)) !== null) {
      out += block(text.slice(last, m.index));
      var code = m[2].replace(/\n$/, '');
      var lang = m[1] || 'text';
      out += '<div class="code-block"><div class="code-head"><span>' + esc(lang) +
             '</span><button class="copy-btn" type="button">复制</button></div><pre><code>' +
             esc(code) + '</code></pre></div>';
      last = fence.lastIndex;
    }
    out += block(text.slice(last));
    return out;
  }
  window.__gwMD = { esc: esc, renderMD: renderMD };
})();
</script>

<!-- 应用逻辑区 -->
<script>
(function () {
  'use strict';
  var MD = window.__gwMD;

  function api() { return window.electronAPI || null; }

  var messagesEl = document.getElementById('messages');
  var emptyEl = document.getElementById('gateway-empty');
  var inputEl = document.getElementById('gateway-input');
  var sendBtn = document.getElementById('gateway-send');
  var statusEl = document.getElementById('gateway-status');
  var modelLabel = document.getElementById('gateway-model-label');
  var streamingEl = null;   // 当前流式渲染的 .content
  var streamingRaw = '';    // 流式期间累计的原始文本
  var busy = false;
  var stickBottom = true;   // 用户上翻时暂停自动滚动

  // 输入框自适应高度（ChatGPT 行为）
  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
  }
  inputEl.addEventListener('input', autoGrow);

  // ---------- 会话 ID：?session= 或 #session= 携带；hash 变化触发会话绑定 ----------
  function genSid() {
    return 'gw-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }
  function currentSessionId() {
    var m = location.search.match(/[?&]session=([A-Za-z0-9_-]+)/);
    if (m) return m[1];
    m = location.hash.match(/session=([A-Za-z0-9_-]+)/);
    if (m) return m[1];
    return null;
  }
  var sessionId = currentSessionId() || genSid();

  function ensureUrlSession() {
    if (location.hash !== '#session=' + sessionId) {
      location.hash = 'session=' + sessionId;
    }
  }

  // ---------- 渲染 ----------
  function el(tag, cls, text) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (text != null) d.textContent = text;
    return d;
  }
  function nearBottom() {
    return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 90;
  }
  function scrollBottom(force) {
    if (force || stickBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function hideEmpty() { if (emptyEl && emptyEl.parentElement) { emptyEl.remove(); } }
  function addMessage(role, text, when) {
    hideEmpty();
    var box = el('div', 'msg ' + role);
    box.setAttribute('data-message-author-role', role === 'assistant' ? 'assistant' : 'user');
    var inner = el('div', 'msg-inner');
    var meta = el('div', 'meta');
    if (role === 'assistant') {
      meta.appendChild(el('span', 'avatar', '鸟'));
      meta.appendChild(el('span', null, 'Cuckoo'));
    } else {
      meta.appendChild(el('span', null, '你'));
      if (when) meta.appendChild(el('span', null, when));
    }
    inner.appendChild(meta);
    var content = el('div', 'content');
    if (role === 'assistant') { content.classList.add('md'); content.innerHTML = MD.renderMD(text || ''); }
    else { content.textContent = text || ''; }
    inner.appendChild(content);
    box.appendChild(inner);
    messagesEl.appendChild(box);
    scrollBottom(role !== 'user');
    return content;
  }
  function bindCopy(root) {
    root.querySelectorAll('.copy-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var code = btn.closest('.code-block').querySelector('code');
        var done = function () { btn.textContent = '已复制'; setTimeout(function () { btn.textContent = '复制'; }, 1200); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code.textContent).then(done, done);
        else { var r = document.createRange(); r.selectNodeContents(code); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); s.removeAllRanges(); done(); }
      });
    });
  }
  function renderHistory(history) {
    messagesEl.innerHTML = '';
    emptyEl = buildEmpty();
    messagesEl.appendChild(emptyEl);
    (history || []).forEach(function (m) {
      if (m && (m.role === 'user' || m.role === 'assistant')) bindCopy(addMessage(m.role, m.content));
    });
    if (messagesEl.querySelector('.msg')) hideEmpty();
    scrollBottom(true);
  }
  function buildEmpty() {
    var wrap = el('div');
    wrap.id = 'gateway-empty';
    wrap.appendChild(el('div', 'big', '🪺'));
    wrap.appendChild(el('h2', null, '有什么可以帮忙的？'));
    var tip = el('div', 'tip');
    tip.innerHTML = '连接任意 OpenAI 兼容网关，把 GPT 变成本地 Agent<br>先点右上角 <kbd>⚙ 设置</kbd> 填入 Base URL / API Key / 模型名<br><kbd>Enter</kbd> 发送 · <kbd>Shift+Enter</kbd> 换行 · 工具结果会自动回传';
    wrap.appendChild(tip);
    return wrap;
  }

  // ---------- 发送 ----------
  async function send(text) {
    if (busy) return false;
    var a = api();
    if (!a || typeof a.gatewaySend !== 'function') { setStatus('electronAPI 未就绪'); return false; }
    text = (text || '').trim();
    if (!text) return false;

    busy = true;
    sendBtn.disabled = true;
    inputEl.disabled = true;
    stickBottom = true;
    addMessage('user', text, timeNow());
    ensureUrlSession();
    streamingEl = addMessage('assistant', '');
    streamingEl.innerHTML = '<span class="cursor"></span>';
    streamingRaw = '';
    setStatus('生成中…');

    try {
      var res = await a.gatewaySend({ sessionId: sessionId, text: text });
      if (res && res.ok) {
        streamingEl.innerHTML = MD.renderMD(res.text || '');
        bindCopy(streamingEl.parentElement);
        try {
          window.dispatchEvent(new CustomEvent('cuckoo-ai-response', {
            detail: { text: res.text || '', finished: true }
          }));
        } catch (e) {}
        setStatus('');
      } else {
        var msg = (res && res.error) || '未知错误';
        if (streamingEl && streamingEl.parentElement) streamingEl.parentElement.remove();
        bindCopy(addMessage('error', msg, timeNow()).parentElement);
        setStatus('');
      }
      return !!(res && res.ok);
    } catch (err) {
      if (streamingEl && streamingEl.parentElement) streamingEl.parentElement.remove();
      bindCopy(addMessage('error', '发送异常: ' + (err && err.message ? err.message : err), timeNow()).parentElement);
      setStatus('');
      return false;
    } finally {
      busy = false;
      sendBtn.disabled = false;
      inputEl.disabled = false;
      streamingEl = null;
      scrollBottom(true);
    }
  }

  function timeNow() {
    var d = new Date();
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function setStatus(t) { statusEl.textContent = t || ''; }

  sendBtn.addEventListener('click', function () {
    var v = inputEl.value;
    inputEl.value = '';
    autoGrow();
    send(v);
  });
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      var v = inputEl.value; inputEl.value = ''; autoGrow(); send(v);
    }
  });
  // 用户上翻时暂停自动滚动，回到底部恢复
  messagesEl.addEventListener('scroll', function () {
    stickBottom = nearBottom();
  });

  // 主进程流式增量：流式期间显示纯文本 + 光标，完成后一次性渲染 Markdown
  if (window.electronAPI && window.electronAPI.onGatewayDelta) {
    window.electronAPI.onGatewayDelta(function (p) {
      if (!p || p.sessionId !== sessionId) return;
      if (p.delta && streamingEl) {
        streamingRaw += p.delta;
        streamingEl.innerHTML = MD.esc(streamingRaw).replace(/\n/g, '<br>') + '<span class="cursor"></span>';
        scrollBottom();
      }
      if (p.done) setStatus('');
    });
  }

  // provider.triggerSend（隔离世界）经 CustomEvent 跨世界触发发送：
  // 用于工具结果回传、初始提示词等非按钮路径
  window.addEventListener('cuckoo-gateway-send', function (ev) {
    var text = ev && ev.detail && ev.detail.text;
    if (!text) return;
    inputEl.value = '';
    autoGrow();
    send(text);
  });

  // ---------- 配置面板 ----------
  var cfgPanel = document.getElementById('gateway-config');
  var cfgErr = document.getElementById('cfg-err');
  document.getElementById('gateway-config-toggle').addEventListener('click', async function () {
    cfgPanel.classList.toggle('open');
    if (cfgPanel.classList.contains('open')) await loadConfigIntoPanel();
  });
  document.getElementById('cfg-cancel').addEventListener('click', function () {
    cfgPanel.classList.remove('open');
  });
  document.getElementById('cfg-eye').addEventListener('click', function () {
    var key = document.getElementById('cfg-apikey');
    var eye = document.getElementById('cfg-eye');
    key.type = key.type === 'password' ? 'text' : 'password';
    eye.textContent = key.type === 'password' ? '显示' : '隐藏';
  });
  async function loadConfigIntoPanel() {
    var a = api(); if (!a) return;
    cfgErr.textContent = '';
    try {
      var res = await a.gatewayGetConfig();
      if (res && res.success) {
        document.getElementById('cfg-baseurl').value = res.config.baseUrl || '';
        document.getElementById('cfg-model').value = res.config.model || '';
        document.getElementById('cfg-temperature').value = res.config.temperature;
        document.getElementById('cfg-apikey').placeholder = res.config.hasKey
          ? '已保存 (' + res.config.apiKeyMasked + ')，留空则不修改'
          : '尚未配置，输入 API Key';
        modelLabel.textContent = res.config.configured
          ? res.config.model
          : '未配置';
      }
    } catch (e) {}
  }
  document.getElementById('cfg-save').addEventListener('click', async function () {
    var a = api(); if (!a) return;
    cfgErr.textContent = '';
    var model = document.getElementById('cfg-model').value.trim();
    var baseUrl = document.getElementById('cfg-baseurl').value.trim();
    var temp = parseFloat(document.getElementById('cfg-temperature').value);
    if (!/^https?:\/\//i.test(baseUrl)) { cfgErr.textContent = '网关地址需以 http(s):// 开头'; return; }
    if (!model) { cfgErr.textContent = '模型名不能为空'; return; }
    if (isNaN(temp) || temp < 0 || temp > 2) { cfgErr.textContent = '温度需为 0-2 的数字'; return; }
    var patch = { baseUrl: baseUrl, model: model, temperature: temp };
    var key = document.getElementById('cfg-apikey').value;
    if (key.trim() !== '') patch.apiKey = key.trim();
    var res = await a.gatewaySaveConfig(patch);
    if (res && res.success) {
      cfgPanel.classList.remove('open');
      document.getElementById('cfg-apikey').value = '';
      await loadConfigIntoPanel();
    } else {
      cfgErr.textContent = (res && res.error) || '保存失败';
    }
  });

  // ---------- 新会话 ----------
  document.getElementById('gateway-new-chat').addEventListener('click', function () {
    var sid = genSid();
    if (sid === sessionId) sid = genSid();
    if (location.hash === '#session=' + sid) bindSession(sid);
    else { sessionId = sid; location.hash = 'session=' + sid; }
  });

  // 会话切换：URL ?session= 或 hash 变化（含新会话/旧会话跳转）
  function bindSession(sid) {
    if (!sid) return;
    sessionId = sid;
    renderHistory([]);
    restoreHistory();
  }
  window.addEventListener('hashchange', function () {
    var sid = currentSessionId();
    if (sid && sid !== sessionId) bindSession(sid);
    else ensureUrlSession();
  });

  async function restoreHistory() {
    var a = api(); if (!a) return;
    try {
      var res = await a.gatewayGetHistory(sessionId);
      if (res && res.success && Array.isArray(res.history)) renderHistory(res.history);
    } catch (e) {}
  }

  // ---------- 启动 ----------
  async function boot() {
    var a = api();
    if (!a) { setTimeout(boot, 300); return; }
    await loadConfigIntoPanel();
    ensureUrlSession();
    await restoreHistory();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
