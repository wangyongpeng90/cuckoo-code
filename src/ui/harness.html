    var thinkEl = d.querySelector('.think');
    thinkEl.querySelector('.think-head').addEventListener('click', function () { thinkEl.classList.toggle('open'); });
    return { el: d, thinkEl: thinkEl, thinkBody: d.querySelector('.think-body'), thinkLabel: d.querySelector('.think-label'), body: d.querySelector('.body') };
  }

  // 去重：已完成的回复文本（防止 finished 流事件重复触发导致重复气泡）
  var lastDoneText = '';
  // 去重：已写入历史的最新 assistant 文本
  var lastPushedAssistant = '';
  // 流式更新：think/text 均为全量快照
  function onStream(think, text, finished) {
    if (!think && !text && !finished) return; // 空心跳，忽略
    // 重复的完成事件：文本与最近一次已完成的一致 → 忽略
    if (finished && text && text.trim() === lastDoneText) return;
    lastActivityAt = Date.now();
    // 有实际输出 = AI 页面正在工作。框架自动发送的轮次（工具结果回传/看门狗/压缩等）
    // 由 onFrameworkSend 置忙；这里兜住"未收到投递事件但确实在出字"的情况。
    // finished 帧不置忙：收尾交给 onAssistantDone（否则会在结束瞬间又点亮运行态）。
    if (!finished && (text || think) && !isBusy()) setStatus('生成中…', 'busy');
    if (!cur) cur = createAssistant();
    if (cur.pending && (think || text)) { cur.pending = false; }
    if (think) {
      cur.thinkEl.style.display = '';
      cur.thinkBody.textContent = think;
      cur.thinkLabel.textContent = text ? '已思考 (' + think.length + ' 字)' : '思考中…';
      // 正文尚未出现时，自动展开思考；正文出现后自动折叠
      if (!text) cur.thinkEl.classList.add('open');
      else if (cur.thinkEl.classList.contains('open') && !cur.userToggled) cur.thinkEl.classList.remove('open');
    }
    if (text) {
      // 工具调用（```cuckoo 块）已由 bridge 的 stripToolBlocks 剥离，这里直接渲染
      cur.body.innerHTML = renderMarkdown(text) + (finished ? '' : '<span class="streaming-cursor"></span>');
    }
    scrollBottom(false); // 跟随但不打扰往上翻看
    // 注意：finished 时不置空 cur，交给 onAssistantDone 收尾（否则会重复渲染一条）
  }

  function onAssistantDone(text) {
    // 回复完成：若有工具仍在执行，任务并未结束 —— 状态与按钮都保持"运行中"
    if (toolRunningCount > 0) setStatus('工具运行中…', 'busy');
    else setStatus('就绪', 'ready');
    var t = (text || '').trim();
    // 去重：与上一条已完成一致则忽略（防 finished 流 + assistant-done 双触发）
    if (t && t === lastDoneText) { if (cur) cur = null; return; }
    if (t) lastDoneText = t;
    if (cur) {
      if (t) {
        cur.body.innerHTML = renderMarkdown(t);
      } else {
        // 纯思考/工具回合：仅收尾思考块（"思考中…" → "已思考 (N 字)"），不新增气泡
        try {
          var tl = cur.thinkBody ? cur.thinkBody.textContent : '';
          if (tl && cur.thinkLabel) cur.thinkLabel.textContent = '已思考 (' + tl.length + ' 字)';
        } catch (e) { /* ignore */ }
      }
      cur = null;
      scrollBottom(false);
      return;
    }
    if (!t) return;
    clearEmpty();
    var d = document.createElement('div');
    d.className = 'msg assistant';
    d.innerHTML = '<div class="prefix">' + PREFIX_SVG + 'Cuckoo</div><div class="body">' + renderMarkdown(t) + '</div>';
    attachCopy(d, function () { return t; });
    stream.appendChild(d);
    scrollBottom();
  }

  // 从工具代码提取工具名 + 首个字符串参数（用于卡片标题，不显示原始代码）
  function parseToolCall(code) {
    var s = String(code || '');
    var KNOWN = ['readLines', 'read', 'write', 'edit', 'glob', 'grep', 'todoWrite', 'bash', 'pwsh', 'deleteFile', 'webFetch', 'mysql', 'mcpCall', 'mcpListServers', 'mcpGetTools', 'openBrowserWindow', 'injectJS', 'attachFile', 'runAgent'];
    var name = '';
    var m = /await\s+([a-zA-Z][a-zA-Z0-9_]*)\s*\(/.exec(s);
    if (m) name = m[1];
    if (!name) { for (var i = 0; i < KNOWN.length; i++) { if (s.indexOf(KNOWN[i] + '(') >= 0) { name = KNOWN[i]; break; } } }
    if (!name) name = 'tool';
    var arg = '';
    try {
      var re = new RegExp(name + '\\s*\\(\\s*([\'"\`])([\\s\\S]*?)\\1');
      var am = re.exec(s);
      if (am) arg = am[2];
    } catch (e) { /* ignore */ }
    if (arg.length > 60) arg = arg.slice(0, 60) + '…';
    return { name: name, arg: arg };
  }

  function addToolStart(code) {
    clearEmpty();
    var id = 'tool-' + (++toolSeq);
    var tc = parseToolCall(code);
    var wrap = document.createElement('div');
    wrap.className = 'tool';
    wrap.innerHTML =
      '<div class="tool-card open" id="' + id + '">' +
        '<div class="tool-head">' +
          '<span class="tool-icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h4l3 3v9H3V2z"/><path d="M6 7h4M6 10h4"/></svg></span>' +
          '<span class="tool-name">' + esc(tc.name) + '</span>' +
          '<span class="tool-arg">' + esc(tc.arg) + '</span>' +
          '<span class="tool-badge run">运行中</span>' +
          '<span class="tool-caret"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></span>' +
        '</div>' +
        '<div class="tool-body">' +
          '<div class="tool-sec"><div class="tool-sec-label">Code</div><pre class="tool-pre">' + esc(code) + '</pre></div>' +
          '<div class="tool-sec out-sec" style="display:none"><div class="tool-sec-label">Result</div><pre class="tool-pre out-pre"></pre></div>' +
        '</div>' +
      '</div>';
    stream.appendChild(wrap);
    wrap.querySelector('.tool-head').addEventListener('click', function () { wrap.querySelector('.tool-card').classList.toggle('open'); });
    // 尊重用户当前位置：在底部才跟随，正在翻看历史则不打扰
    scrollBottom(false);
    return id;
  }

  function addToolEnd(success, output, error) {
    // 找最近一个"运行中"的卡片（不限于 open，避免被折叠后漏匹配）
    var all = stream.querySelectorAll('.tool-card');
    var target = null;
    for (var i = all.length - 1; i >= 0; i--) {
      var b = all[i].querySelector('.tool-badge');
      if (b && b.classList.contains('run')) { target = all[i]; break; }
    }
    if (!target) return;
    var badge = target.querySelector('.tool-badge');
    badge.className = 'tool-badge ' + (success ? 'ok' : 'err');
    badge.textContent = success ? '完成' : '失败';
    var outSec = target.querySelector('.out-sec');
    var outPre = target.querySelector('.out-pre');
    if (outSec && outPre) {
      outSec.style.display = '';
      outPre.textContent = success ? (output || '(无输出)') : (error || '未知错误');
      if (!success) outPre.classList.add('err');
    }
    // 执行完成后统一自动折叠（成功/失败都折叠，用户可点击展开）
    // 关键：折叠会让内容变矮，需在抑制 pinBottom 副作用的前提下保持用户当前视图位置
    var wasPinned = pinBottom;
    var prevTop = stream.scrollTop;
    suppressPin = true;
    target.classList.remove('open');
    if (wasPinned) {
      stream.scrollTop = stream.scrollHeight;
    } else {
      // 原本不在底部 → 锁定原位置（折叠只影响下方内容高度）
      stream.scrollTop = prevTop;
    }
    // 下一帧解除抑制并校正（内容高度已稳定）；同时用 setTimeout 兜底，避免 rAF 未触发导致 suppressPin 卡死
    function settle() {
      if (wasPinned) {
        stream.scrollTop = stream.scrollHeight;
        pinBottom = true;
      } else {
        stream.scrollTop = Math.min(prevTop, Math.max(0, stream.scrollHeight - stream.clientHeight));
        pinBottom = false;
      }
      suppressPin = false;
      updateScrollBtn();
    }
    var settled = false;
    function once() { if (!settled) { settled = true; settle(); } }
    requestAnimationFrame(once);
    setTimeout(once, 60);
  }

  if (api.onEvent) {
    api.onEvent(function (payload) {
      if (!payload) return;
      lastActivityAt = Date.now();
      switch (payload.type) {
        case 'user': addUser(payload.text); break;
        case 'stream': cancelGoalNudge(); onStream(payload.think, payload.text, payload.finished); break;
        case 'assistant-done': {
          var adRaw = payload.text || '';
          // 正文不做任何删改：工具调用块由 bridge 的 stripToolBlocks 负责剥离。
          // 这里仅在「计划模式草拟阶段」识别模型偶尔写出的裸 JSON 计划，让面板仍可用。
          if (planState && planState.phase === 'draft') {
            var adTodos = tryParseTodoJson(adRaw);
            if (adTodos && adTodos.length) {
              planBySession[currentSessionId] = adTodos;
              renderPlan(adTodos);
              pushHist({ t: 'plan', todos: adTodos });
            }
          }
          var adText = adRaw.trim();
          var adThink = (cur && cur.thinkBody) ? cur.thinkBody.textContent : '';
          onAssistantDone(adRaw);
          if (adText && adText !== lastPushedAssistant) { lastPushedAssistant = adText; pushHist({ t: 'assistant', text: adRaw, think: adThink }); }
          // 草拟阶段拿到计划条目 → 立刻进闸门（条目来自 todoWrite 工具或裸 JSON 识别）
          if (planState && planState.phase === 'draft' && planBySession[currentSessionId] && planBySession[currentSessionId].length) planAwaitConfirm();
          // 执行阶段：模型在索要用户输入 → 停下等，绝不硬催（否则会刷成重复索要）
          if (planIsExecuting() && asksForUserInput(adText)) planBlockedOnUser();
          if (goal && !goal.done && !goal.paused) checkProgress(adText);
          else if (planIsExecuting()) checkPlanProgress(adText);
          scheduleGoalNudge();
          break;
        }
        case 'plan': {
          planBySession[currentSessionId] = payload.todos || [];
          renderPlan(payload.todos);
          renderPlanBar();
          pushHist({ t: 'plan', todos: payload.todos || [] });
          // 草拟阶段收到计划条目 → 进入待确认闸门（绝不自动开跑）
          if (planState && planState.phase === 'draft' && planBySession[currentSessionId].length) planAwaitConfirm();
          // 执行阶段：全部步骤完成 → 收尾
          else if (planState && planState.phase === 'exec' && planBySession[currentSessionId].length && !planHasPending()) finishPlan();
          break;
        }
        case 'goal-done': onGoalDone(); break;
        // 框架侧投递（系统提示词 / 工具结果回传 / 看门狗 / 重试 / 压缩等）：
        // 内容不显示（底层指令），但必须体现"AI 页面正在被驱动"。
        case 'framework-send': onFrameworkSend(payload.tag); break;
        // 任务空闲（observer 权威判定：本轮回复无工具调用 = 真的结束）→ 收尾
        case 'task-idle': onTaskIdle(); break;
        // AI 页面权威生成状态（每 2 秒心跳）→ 校正运行态，解套"卡在运行中"
        case 'ai-state': onAiState(!!payload.generating); break;
        case 'assistant': {
          var aText = (payload.text || '').trim();
          onAssistantDone(payload.text);
          if (aText && aText !== lastPushedAssistant) { lastPushedAssistant = aText; pushHist({ t: 'assistant', text: payload.text }); }
          break;
        }
        case 'tool-start': cancelGoalNudge();
          // 中止后、尚未开始新任务时到达的工具开始事件：只渲染卡片，不重新置忙
          if (!aborted()) { toolRunningCount++; syncBusyIndicators(); }
          // 工具调用开始 = 当前助手回合结束：收尾思考块并关闭当前气泡，避免"思考中…"悬留
          if (cur) { try { var tl0 = cur.thinkBody ? cur.thinkBody.textContent : ''; if (tl0 && cur.thinkLabel) cur.thinkLabel.textContent = '已思考 (' + tl0.length + ' 字)'; } catch (e) { /* ignore */ } cur = null; }
          addToolStart(payload.code); setStatus('工具运行中…', 'busy'); pushHist({ t: 'tool', code: payload.code, success: null, output: '', error: '' }); break;
        case 'tool-end': if (toolRunningCount > 0) toolRunningCount--; addToolEnd(payload.success, payload.output, payload.error);
          // 工具结束不等于任务结束，但也不等于"仍在生成"：
          // 还有工具在跑 → 工具运行中；否则等模型产生下一轮输出（task-idle / 流式事件会接管）。
          // 原先无条件置 busy 会在收尾事件丢失时把状态永久钉在运行态。
          lastActivityAt = Date.now();
          if (toolRunningCount > 0) setStatus('工具运行中…', 'busy');
          else if (generating) setStatus('生成中…', 'busy');
          syncBusyIndicators(); {
          // 更新最近一个"未完成"的工具历史（从后往前找 success===null）
          for (var ti = history.length - 1; ti >= 0; ti--) {
            if (history[ti].t === 'tool' && history[ti].success === null) {
              history[ti].success = payload.success; history[ti].output = payload.output; history[ti].error = payload.error; saveHist(); break;
            }
          }
          // 工具全部结束且无生成中：补一次续跑判定。
          // （assistant-done 时若工具仍在跑会被 isBusy 挡掉，工具循环里没有这个钩子就永远不推进）
          if (!isBusy()) scheduleGoalNudge();
          break;
        }
        case 'session-changed': onSessionChanged(payload.sessionId); break;
        // 新对话：**完整丢弃**当前视图。
        // 不能靠 session-changed 代劳 —— 首页 URL 无会话 id，sid 是空串，
        // 会命中 onSessionChanged 首行的 `sid === currentSessionId` 早退，什么都清不掉。
        case 'reset': resetConversation(); break;
        case 'status': setStatus(payload.text, payload.busy ? 'busy' : 'ready'); break;
      }
    });
  }

  function send() {
    var text = input.value.trim();
    var files = pendingFiles.slice();
    var hints = pendingHints.slice();
    console.log('[harness] send() 调用, text 长度=' + text.length + ', files=' + files.length + ', hints=' + hints.length);
    if (!text && files.length === 0 && hints.length === 0) return;
    clearAbortSuppression(); // 新任务：解除中止后的抑制窗口
    resetPlanDrive(); // 新任务：重置计划驱动轮数
    hideSlashMenu();
    input.value = '';
    input.style.height = 'auto';
    // 目标："/goal xxx" 或带"目标"chip（与"计划"同款）
    var displayText = text, sendText = text;
    var goalText = null;
    var hasGoalChip = false, hasPlanChip = false;
    for (var gi = 0; gi < hints.length; gi++) {
      if (hints[gi].isGoal) hasGoalChip = true;
      if (hints[gi].isPlan) hasPlanChip = true;
    }
    if (hasGoalChip) { goalText = text; }
    else if (/^\/goal(\s|$)/.test(text)) { goalText = text.replace(/^\/goal\s*/, '').trim(); }
    // 计划："/plan [任务描述]" 或带"计划"chip —— harness 层显式解析，进入计划（闸门）模式
    if (!hasGoalChip && !goalText && (hasPlanChip || /^\/plan(\s|$)/.test(text))) {
      var planArg = hasPlanChip ? text : text.replace(/^\/plan\s*/, '').trim();
      if (!planArg && planState && !planIsWaiting()) {
        // 无参数且计划已就绪/执行中 = 查看状态
        var doneCount = 0, all = planTodos();
        for (var pi = 0; pi < all.length; pi++) { if (String(all[pi].status || '').toLowerCase() === 'completed') doneCount++; }
        var phaseLabel = { draft: '生成计划中', confirm: '待确认', exec: '执行中', done: '已完成' }[planState.phase] || '计划';
        appendSystem('当前计划：' + phaseLabel + ' · 步骤 ' + doneCount + '/' + all.length +
          (planState.phase === 'exec' ? ' · 迭代 ' + planState.round + ' · ' + fmtElapsed(planElapsedMs()) : ''));
        input.focus();
        return;
      }
      if (planArg) {
        startPlanMode(planArg);
        displayText = '[计划] ' + planArg;
        sendText = buildPlanSendText(planArg);
      } else {
        appendSystem('用法：/plan <任务描述> —— 先列出计划条目，确认后再执行');
        input.focus();
        return;
      }
    }
    if (goalText !== null) {
      if (!goalText) {
        // 无参数 = 查看当前目标（对齐 DSH 的"设置或查看"语义）
        if (goal) {
          appendSystem('当前目标：' + goal.text + '（' + (goal.done ? '已完成' : (goal.paused ? '已暂停' : '进行中')) +
            ' · 迭代 ' + goal.round + (goal.maxIterations ? '/' + goal.maxIterations : '') + ' · ' + fmtElapsed(goalElapsedMs()) + '）');
        } else {
          appendSystem('用法：/goal <目标描述> —— 设定后自动多轮推进，目标完成后自动结束；也可点「暂停」中止当前任务、点「退出」彻底停止');
        }

        return;
      }
      startGoal(goalText);
      displayText = '[目标] ' + goalText;
      sendText = buildGoalSendText(goalText);
    }
    // 隐藏指令（技能/工具/计划）：附加到发给 AI 的文本，但不进对话气泡
    var hintText = hints.length ? hints.filter(function (h) { return !h.isGoal && !h.isPlan; }).map(function (h) { return h.text; }).join('\n') : '';
    if (hintText) sendText = (hintText + '\n' + sendText).trim();
    var attachNote = files.length ? ('[附件 ' + files.length + ' 个] ') : '';
    // 气泡：/goal 显示"[目标] xxx"；正常显示用户文字；仅选 chip 时显示"[指令] 标签"
    var bubbleText;

      });

        var ok = res && res.uploaded ? res.uploaded : 0;

  function readAsBase64(file) {
    return new Promise(function (resolve, reject) {

        resolve(comma >= 0 ? s.slice(comma + 1) : s);

  }

  function isBlocked(name) {
    var lower = (name || '').toLowerCase();
    for (var i = 0; i < BLOCKED_EXT.length; i++) {

  function addFiles(fileList) {

    var accepted = [];
    for (var ai = 0; ai < arr.length; ai++) {
      if (isBlocked(arr[ai].name)) {
        var bmsg = '已跳过不支持的附件：' + arr[ai].name + '（聊天平台不接受可执行文件/二进制库）';
        appendSystem(bmsg);
        pushHist({ t: 'system', text: bmsg });
      } else {
        accepted.push(arr[ai]);
      }
    }
    arr = accepted;
    if (!arr.length) return;
    var jobs = arr.map(function (file) {
      return readAsBase64(file).then(function (b64) {
        pendingFiles.push({ name: file.name || ('file-' + Date.now()), mime: file.type || 'application/octet-stream', size: file.size || 0, data: b64 });

    if (api.newConversation) api.newConversation().catch(function () { /* ignore */ });
    // 新对话回到首页 → 刷新"需初始化项目"状态
    setTimeout(function () { if (typeof refreshHarnessState === 'function') refreshHarnessState(); }, 800);
  });

  // ===== 设置弹窗（目标/计划的最大迭代次数）=====
  var settingsMask = document.getElementById('settings-mask');
  var smGoalMax = document.getElementById('sm-goal-max');
  function openSettings() {
    if (!settingsMask) return;
    try { if (smGoalMax) smGoalMax.value = String(goalMaxIterations()); } catch (e) { /* ignore */ }
    settingsMask.classList.add('show');
  }
  function closeSettings() { if (settingsMask) settingsMask.classList.remove('show'); }
  var btnSettings = document.getElementById('btn-settings');
  if (btnSettings) btnSettings.addEventListener('click', openSettings);
  var smCancel = document.getElementById('sm-cancel');
  if (smCancel) smCancel.addEventListener('click', closeSettings);
  var smSave = document.getElementById('sm-save');
  if (smSave) smSave.addEventListener('click', function () {
    var v = parseInt((smGoalMax && smGoalMax.value) || '', 10);
    if (!Number.isFinite(v) || v <= 0) { appendSystem('迭代次数需为正整数'); return; }
    try { localStorage.setItem('cuckoo-goal-max-iterations', String(v)); } catch (e) { /* ignore */ }
    if (goal) { goal.maxIterations = v; renderGoalBar(); }
    closeSettings();
    appendSystem('设置已保存：最大迭代次数 = ' + v);
  });
  if (settingsMask) settingsMask.addEventListener('click', function (e) { if (e.target === settingsMask) closeSettings(); });

  // Ctrl+R 重载页面（加载最新 HTML）
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && !e.shiftKey && (e.key === 'r' || e.key === 'R')) {
      e.preventDefault();
      location.reload();
    }
  });

  scrollBtn = document.getElementById('scroll-bottom');
  if (scrollBtn) {
    scrollBtn.addEventListener('click', function () { pinBottom = true; stream.scrollTop = stream.scrollHeight; updateScrollBtn(); });
  }
  stream.addEventListener('scroll', function () {
    if (suppressPin) return; // 折叠等程序化高度变化引发的滚动，不改跟随状态
    pinBottom = isNearBottom();
    updateScrollBtn();
  });

  try { EMPTY_HTML = stream.innerHTML; } catch (e) { /* ignore */ }
  loadHist();
  restoreHist();
  loadGoalState();
  renderGoalBar();
  loadPlanState();
  renderPlanBar();
  input.focus();

  // 测试钩子（仅探针使用，不影响运行时行为）
  window.__ckHarnessTest = {
    tryParseTodoJson: tryParseTodoJson,
    asksForUserInput: asksForUserInput,
    planState: function () { return planState; }
  };

  // ===== 首次对话需选择项目目录 =====
  var initBtn = document.getElementById('init-project-btn');
  var composerInner = document.querySelector('.composer-inner');
  var composerHint = document.querySelector('.composer-hint');
  function applyHarnessState(st) {
    var needInit = !!(st && st.needInit);
    if (initBtn) initBtn.style.display = needInit ? 'block' : 'none';
    if (composerInner) composerInner.style.display = needInit ? 'none' : '';
    if (composerHint) composerHint.style.display = needInit ? 'none' : '';
  }
  function refreshHarnessState() {
    if (!api.getState) return;
    api.getState().then(applyHarnessState).catch(function () { /* ignore */ });
  }
  if (api.onState) api.onState(applyHarnessState);
  refreshHarnessState();
  if (initBtn) initBtn.addEventListener('click', function () {
    if (!api.initProject) return;
    initBtn.disabled = true;
    var old = initBtn.textContent;
    initBtn.textContent = '初始化中…';
    api.initProject().then(function () {
      initBtn.textContent = old;
      initBtn.disabled = false;
      refreshHarnessState();
    }).catch(function () {
      initBtn.textContent = old;
      initBtn.disabled = false;
    });
  });

  if (api.ready) api.ready();

  // ===== 主题：跟随 Cuckoo 主题系统（写 --ck-* + body[data-ck-dark]）=====
  (function () {
    if (typeof api.onThemeChanged !== 'function') return;
    var applied = [];
    function applyTheme(snap) {
      if (!snap || !snap.active) return;
      var scheme = snap.active.colorScheme;
      document.documentElement.style.colorScheme = scheme;
      if (scheme === 'dark') document.body.setAttribute('data-ck-dark', '');
      else document.body.removeAttribute('data-ck-dark');
      for (var i = 0; i < applied.length; i++) document.documentElement.style.removeProperty(applied[i]);
      applied = [];
      var tokens = snap.active.tokens || {};
      for (var name in tokens) {
        if (Object.prototype.hasOwnProperty.call(tokens, name)) {
          document.documentElement.style.setProperty(name, tokens[name]);
          applied.push(name);
        }
      }
    }
    api.onThemeChanged(applyTheme);
    if (typeof api.themeGet === 'function') {
      api.themeGet().then(function (r) { if (r && r.success && r.snapshot) applyTheme(r.snapshot); }).catch(function () {});
    }
    if (typeof api.themeSubscribe === 'function') api.themeSubscribe().catch(function () {});

    // 插件注入的 CSS（壁纸/字体等）：harness 也是 Cuckoo 界面，一起跟随
    function applyPluginStyle(pluginId, css) {
      if (!pluginId || typeof css !== 'string') return;
      var tag = document.querySelector('style[data-plugin-style="' + pluginId + '"]');
      if (!tag) { tag = document.createElement('style'); tag.setAttribute('data-plugin-style', pluginId); document.head.appendChild(tag); }
      tag.textContent = css;
    }
    if (typeof api.onPluginStyle === 'function') api.onPluginStyle(function (m) { if (m) applyPluginStyle(m.pluginId, m.css); });
    // 拉取已缓存的插件 CSS（harness 懒加载，插件加载时可能还没进纯净模式）
    if (typeof api.listPluginStyles === 'function') {
      api.listPluginStyles().then(function (r) { if (r && r.success && r.styles) { for (var i = 0; i < r.styles.length; i++) { try { applyPluginStyle(r.styles[i].pluginId, r.styles[i].css); } catch (e) {} } } }).catch(function () {});
    }
    if (typeof api.onPluginStyleRemove === 'function') api.onPluginStyleRemove(function (m) {
      if (!m || !m.pluginId) return;
      var tag = document.querySelector('style[data-plugin-style="' + m.pluginId + '"]');
      if (tag && tag.parentNode) tag.parentNode.removeChild(tag);
    });

    // 插件背景图（基座对齐：background-position 补偿 offsetX/offsetY）
    function applyBackground(data) {
      var tag = document.getElementById('ck-harness-bg');
      if (!data || !data.url) { if (tag) tag.remove(); return; }
      if (!tag) { tag = document.createElement('style'); tag.id = 'ck-harness-bg'; document.head.appendChild(tag); }
      var overlay = data.overlay || 'rgba(10,12,20,0.5)';
      var ox = data.offsetX || 0, oy = data.offsetY || 0;
      var w = data.winW || window.innerWidth, h = data.winH || window.innerHeight;
      // 锚定窗口左上角：图铺窗口尺寸，harness 偏移 (-ox,-oy)；铺在 html/body 保证填满视口
      tag.textContent = 'html, body { background: linear-gradient(' + overlay + ',' + overlay + '), url(' + data.url + ') no-repeat fixed !important;' +
        'background-size: auto, ' + w + 'px ' + h + 'px !important;' +
        'background-position: 0 0, -' + ox + 'px -' + oy + 'px !important; }';
    }
    if (typeof api.onHarnessBackground === 'function') api.onHarnessBackground(applyBackground);
    // 拉取已缓存的背景（harness 懒加载，插件设背景时可能还没进纯净模式）
    if (typeof api.getHarnessBackground === 'function') {
      api.getHarnessBackground().then(function (r) { if (r && r.success && r.background) applyBackground({ url: r.background.url, overlay: r.background.overlay, offsetX: r.offsetX, offsetY: r.offsetY, winW: r.winW, winH: r.winH }); }).catch(function () {});
    }
  })();
})();
</script>
</body>
</html>
