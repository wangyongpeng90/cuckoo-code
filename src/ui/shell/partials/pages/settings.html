            <!-- ===== 设置 ===== -->
            <div class="ck-tab" data-panel="settings">
              <div class="ck-card">
                <div class="ck-set-group-title">外观</div>
                <div class="ck-set-field">
                  <span class="ck-set-key">主题</span>
                  <select class="ck-set-input" id="st-theme-select">
                    <option value="system">跟随系统</option>
                    <option value="light">浅色</option>
                    <option value="dark">深色</option>
                  </select>
                </div>
              </div>
              <div class="ck-card">
                <div class="ck-set-group-title">失败自动重试</div>
                <div class="ck-set-field ck-set-toggle">
                  <span class="ck-set-key">启用自动重试</span>
                  <label class="ck-switch">
                    <input type="checkbox" id="st-retry-enabled" />
                    <span class="ck-switch-track"></span>
                  </label>
                </div>
                <div class="ck-set-field">
                  <span class="ck-set-key">普通失败间隔（秒）</span>
                  <div class="ck-set-inline">
                    <input type="number" class="ck-set-input" id="st-retry-delay-min" min="0" step="1" />
                    <span class="ck-set-sep">至</span>
                    <input type="number" class="ck-set-input" id="st-retry-delay-max" min="0" step="1" />
                  </div>
                </div>
                <div class="ck-set-field">
                  <span class="ck-set-key">普通失败重试次数（负数=无限）</span>
                  <input type="number" class="ck-set-input" id="st-retry-count" step="1" />
                </div>
                <div class="ck-set-field">
                  <span class="ck-set-key">操作频繁重试间隔（秒）</span>
                  <input type="number" class="ck-set-input" id="st-retry-429-delay" min="0" step="1" />
                </div>
                <div class="ck-set-field">
                  <span class="ck-set-key">操作频繁重试次数（负数=无限）</span>
                  <input type="number" class="ck-set-input" id="st-retry-429-count" step="1" />
                </div>
                <div class="ck-set-field">
                  <span class="ck-set-key">重试提示词</span>
                  <textarea class="ck-set-textarea" id="st-retry-prompt" rows="3"></textarea>
                </div>
                <div class="ck-set-field">
                  <span class="ck-set-key">AI 回复超时后重试（秒）</span>
                  <input type="number" class="ck-set-input" id="st-xhr-idle-timeout" min="0" step="1" />
                </div>
                <div class="ck-set-field">
                  <span class="ck-set-key">超时重试提示词</span>
                  <input type="text" class="ck-set-input" id="st-watchdog-prompt" />
                </div>
                <div class="ck-set-field">
                  <span class="ck-set-key">超时重试次数（负数=无限）</span>
                  <input type="number" class="ck-set-input" id="st-watchdog-count" step="1" />
                </div>
              </div>

              <div class="ck-card">
                <div class="ck-set-group-title">发送延迟</div>
                <div class="ck-set-field">
                  <span class="ck-set-key">延迟区间（秒）</span>
                  <div class="ck-set-inline">
                    <input type="number" class="ck-set-input" id="st-send-delay-min" min="0" step="0.1" />
                    <span class="ck-set-sep">至</span>
                    <input type="number" class="ck-set-input" id="st-send-delay-max" min="0" step="0.1" />
                  </div>
                </div>
              </div>

              <div class="ck-card">
                <div class="ck-set-group-title">附件上传间隔</div>
                <div class="ck-set-field">
                  <span class="ck-set-key">上传后检测等待（秒）</span>
                  <div class="ck-set-inline">
                    <input type="number" class="ck-set-input" id="st-attach-delay-min" min="0" step="0.1" />
                    <span class="ck-set-sep">至</span>
                    <input type="number" class="ck-set-input" id="st-attach-delay-max" min="0" step="0.1" />
                  </div>
                </div>
              </div>

              <div class="ck-card">
                <div class="ck-set-group-title">网络安全</div>
                <div class="ck-set-field ck-set-toggle">
                  <span class="ck-set-key">拒绝 webFetch 访问内网/本地地址</span>
                  <label class="ck-switch">
                    <input type="checkbox" id="st-ssrf-guard" />
                    <span class="ck-switch-track"></span>
                  </label>
                </div>
                <p class="ck-about-tip">开启后，webFetch 将拒绝访问内网、回环、保留地址（防 SSRF）。默认关闭（可访问本地项目）。</p>
              </div>

              <div class="ck-actions">
                <button class="ck-btn ck-btn-primary" id="st-save">保存设置</button>
                <button class="ck-btn ck-btn-secondary" id="st-reset">恢复默认</button>
                <button class="ck-icon-btn" id="st-refresh" title="刷新（重新读取当前设置）">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
                </button>
              </div>
            </div>
