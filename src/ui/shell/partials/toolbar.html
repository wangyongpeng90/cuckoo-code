    <div class="toolbar">
      <button class="project-picker" id="project-picker" title="当前项目目录">
        <span class="pp-icon" id="pp-icon">?</span>
        <span class="pp-name" id="pp-name">未选择</span>
        <svg class="pp-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button class="harness-toggle" id="btn-harness" title="切换纯净对话模式（Ctrl+Shift+H）">净</button>
      <div class="divider"></div>
      <button class="nav-btn disabled" id="btn-back" title="后退">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="nav-btn disabled" id="btn-forward" title="前进">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <button class="nav-btn" id="btn-reload" title="刷新">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="nav-btn" id="btn-address" title="显示/隐藏地址栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></svg>
      </button>
      <div class="url-wrap cuckoo-hidden">
        <svg class="lock" id="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input class="url-input" id="url-input" placeholder="输入网址后回车" spellcheck="false" autocomplete="off"/>
      </div>
      <div class="divider"></div>
      <button class="nav-btn" id="btn-home" title="新建对话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="divider ck-win-divider"></div>
      <div class="ck-win-controls">
        <button class="ck-win-btn" id="ck-win-min" title="最小化">
          <svg viewBox="0 0 12 12"><rect x="2" y="5.5" width="8" height="1"/></svg>
        </button>
        <button class="ck-win-btn" id="ck-win-max" title="最大化">
          <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor"/></svg>
        </button>
        <button class="ck-win-btn ck-win-close" id="ck-win-close" title="关闭">
          <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
        </button>
      </div>
    </div>
